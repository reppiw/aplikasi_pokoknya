name: aplikasi_pokoknya
description: "Spatial Social Hub — isometric virtual office with real-time avatar presence."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.4.3       # AsyncNotifier, StreamProvider for Firebase streams

  # Firebase
  firebase_core: ^4.15.0         # Required base for all Firebase packages
  firebase_auth: ^6.7.0          # User authentication
  cloud_firestore: ^6.10.0       # Persistent avatar positions + group/room data
  firebase_messaging: ^16.7.0    # FCM — targeted room-ping push notifications

  # Unity integration — add flutter_unity_widget back when the Unity project
  # is ready to embed. The 2022.x release uses jcenter() which is incompatible
  # with AGP 9+; a patched version or manual AAR integration will be needed.
  # flutter_unity_widget: ^2022.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Homepage_Background.jpg

  shaders:
    - shaders/gradient_waves.frag
